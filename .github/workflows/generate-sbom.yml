name: WebGoat SBOM Generation

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout the code
    - name: Checkout Repository
      uses: actions/checkout@v4

    # Step 2: Set up JDK 17 (Temurin)
    - name: Set up JDK 17 (Temurin)
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    # Step 3: Verify the Java version
    - name: Check Java version
      run: java -version   # This will print the Java version to the logs

    # Step 4: Install Maven
    - name: Install Maven
      run: |
        sudo apt-get update
        sudo apt-get install -y maven

    # Step 5: Build WebGoat with Maven
    - name: Build WebGoat with Maven
      run: mvn clean install

    # Step 6: Generate SBOM using Microsoft SBOM Tool
    - name: Generate SBOM using Microsoft SBOM Tool
      run: |
        curl -Lo $RUNNER_TEMP/sbom-tool https://github.com/microsoft/sbom-tool/releases/latest/download/sbom-tool-linux-x64
        chmod +x $RUNNER_TEMP/sbom-tool
        $RUNNER_TEMP/sbom-tool generate -b ./target -bc . -pn WebGoat -pv 8.0.0 -ps OWASP -nsb https://sbom.owasp.org -V Verbose

    # Step 7: Upload Build Artifacts and SBOM File
    - name: Upload Build Artifacts and SBOM File
      uses: actions/upload-artifact@v4
      with:
        name: webgoat-artifacts
        path: ./target
