name: WebGoat SBOM Generation

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest  # Run the job on the latest Ubuntu environment

    steps:
    # Step 1: Checkout the code
    - name: Checkout Repository
      uses: actions/checkout@v4  # Checkout the repository code

    # Step 2: Set up JDK (Use Adoptium instead of AdoptOpenJDK)
    - name: Set up JDK
      uses: actions/setup-java@v3
      with:
        java-version: '17'  # Set Java version 17
        distribution: 'adoptium'  # Use Adoptium distribution instead of adoptopenjdk

    # Step 3: Install Maven
    - name: Install Maven
      run: |
        sudo apt-get update
        sudo apt-get install -y maven  # Ensure Maven is installed

    # Step 4: Build the WebGoat Project with Maven
    - name: Build WebGoat with Maven
      run: mvn clean install  # Build the project using Maven

    # Step 5: Generate SBOM using Microsoft SBOM Tool
    - name: Generate SBOM using Microsoft SBOM Tool
      run: |
        curl -Lo $RUNNER_TEMP/sbom-tool https://github.com/microsoft/sbom-tool/releases/latest/download/sbom-tool-linux-x64
        chmod +x $RUNNER_TEMP/sbom-tool
        $RUNNER_TEMP/sbom-tool generate -b ./target -bc . -pn WebGoat -pv 8.0.0 -ps OWASP -nsb https://sbom.owasp.org -V Verbose

    # Step 6: Upload Build Artifacts and SBOM File
    - name: Upload Build Artifacts and SBOM File
      uses: actions/upload-artifact@v4
      with:
        name: webgoat-artifacts
        path: ./target  # Uploads the build output
