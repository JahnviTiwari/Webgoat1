name: WebGoat SBOM Generation

on:
  workflow_dispatch:  # Trigger the workflow manually from GitHub Actions page

jobs:
  build:

    runs-on: ubuntu-latest  # Use the latest Ubuntu environment for the job

    steps:
    # Step 1: Checkout the code
    - name: Checkout Repository
      uses: actions/checkout@v4  # Checkout the repository code

    # Step 2: Set up JDK (Use Temurin instead of Adoptium)
    - name: Set up JDK
      uses: actions/setup-java@v3  # Set up Java Development Kit (JDK)
      with:
        java-version: '17'  # Specify Java 17, required by WebGoat
        distribution: 'temurin'  # Use Temurin distribution (Eclipse Adoptium's new branding)

    # Step 3: Install Maven
    - name: Install Maven
      run: |
        sudo apt-get update
        sudo apt-get install -y maven  # Install Maven for building WebGoat

    # Step 4: Build WebGoat with Maven
    - name: Build WebGoat with Maven
      run: mvn clean install  # Build the project using Maven

    # Step 5: Generate SBOM using Microsoft SBOM Tool
    - name: Generate SBOM using Microsoft SBOM Tool
      run: |
        curl -Lo $RUNNER_TEMP/sbom-tool https://github.com/microsoft/sbom-tool/releases/latest/download/sbom-tool-linux-x64
        chmod +x $RUNNER_TEMP/sbom-tool  # Make the SBOM tool executable
        # Generate the SBOM for the build output
        $RUNNER_TEMP/sbom-tool generate -b ./target -bc . -pn WebGoat -pv 8.0.0 -ps OWASP -nsb https://sbom.owasp.org -V Verbose

    # Step 6: Upload Build Artifacts and SBOM File
    - name: Upload Build Artifacts and SBOM File
      uses: actions/upload-artifact@v4  # Upload build artifacts (including SBOM file)
      with:
        name: webgoat-artifacts
        path: ./target  # Uploads everything from the 'target' directory, including SBOM file
